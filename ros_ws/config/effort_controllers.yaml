# Effort controllers for gravity compensation.
#
# The vendored bringup claims the position interface only, so
# OpenArm_v10HW::write sends MIT commands with tau = 0 and every joint holds
# position by sitting short of its command. These controllers claim the effort
# interfaces beside the trajectory controllers, which lets a feedforward torque
# be published without the trajectory controllers giving up position.
#
# This is loaded at runtime rather than merged into the vendor controller file:
#
#   ros2 run controller_manager spawner right_forward_effort_controller \
#       -c /controller_manager --param-file ros_ws/config/effort_controllers.yaml
#
# demo.launch.py passes exactly one parameter file to the controller manager, so
# adding these there would mean either patching the vendor snapshot or keeping a
# copy of the whole vendor file in step with it. Runtime loading avoids both, and
# means the effort interfaces stay unclaimed until compensation is asked for.

controller_manager:
  ros__parameters:
    right_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController
    left_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController

right_forward_effort_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    interface_name: effort

left_forward_effort_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: effort
